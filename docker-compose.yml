version: '3.8'

services:
  influxdb:
    image: influxdb:2.7
    container_name: monitor_db
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - PYTHONUNBUFFERED=1
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=superhaslo123
      - DOCKER_INFLUXDB_INIT_ORG=my_org
      - DOCKER_INFLUXDB_INIT_BUCKET=portfolio
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - ./collector/manual_assets.json:/app/manual_assets.json

  grafana:
    image: grafana/grafana:latest
    container_name: monitor_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - influxdb
    volumes:
      - grafana-data:/var/lib/grafana

  python_collector:
    build: ./collector
    container_name: monitor_collector
    env_file:
      - .env
    depends_on:
      - influxdb

volumes:
  influxdb-data:
  grafana-data: